name: golangci-lint
on:
  push:
    branches:
      - master
      - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/checkout@v4
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 10m
